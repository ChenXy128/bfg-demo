function historyPage(){const months=Array.from({length:10},(_,i)=>'2026-'+String(i+1).padStart(2,'0')),prior=months.map(m=>m.replace('2026','2025')),billed=months.reduce((n,m)=>n+monthly(m,'billed'),0),priorBilled=prior.reduce((n,m)=>n+monthly(m,'billed'),0),enquiries=demandTotal(months,'enquiries'),oldEnquiries=demandTotal(prior,'enquiries');return `<div class="finance-intro"><div><strong>Pattern found in the example records</strong><p>${trendInsight()}</p><p>Jan–Oct fees billed: ${money(billed)} in 2026 and ${money(priorBilled)} in 2025. Enquiries: ${enquiries} and ${oldEnquiries}. All figures are examples.</p></div>${b('See next-term estimate','forecast','','small','Opens the Jan–Mar 2027 forecast for this centre and programme.')}</div><div class="filters">${select('Open records for','chart-year',['2026','2025'],ui.year,'data-filter="year"')}</div><div class="grid equal finance-charts">${panel('Monthly finances',`<div class="filters pad">${select('Show money as','money-metric',[['billed','Fees billed'],['received','Money received']],ui.metric,'data-filter="metric"')}</div>${historyChart('money')}`,'Compare the two years. Choose a month to open the records behind its value.')}${panel('Monthly demand',`<div class="filters pad">${select('Show demand as','demand-metric',[['enquiries','Enquiries'],['trials','Trial bookings'],['enrolled','New enrolments']],ui.demandMetric,'data-filter="demandMetric"')}</div>${historyChart('demand')}`,'Enquiries, trials and enrolments show changes in demand through the year.')}</div>${panel('How to read this',`<div class="pad"><div class="finance-steps"><div class="finance-step"><strong>Fees billed</strong>The amount charged on bills issued in that month, after approved fee credits. Term billing can create peaks.</div><div class="finance-step"><strong>Money received</strong>Confirmed payments received in that month, less completed refunds. This includes money still waiting to be matched to a bill.</div><div class="finance-step"><strong>Demand</strong>Example monthly counts by centre and programme. Comparing the same months across years helps show repeated busy periods.</div></div><p class="sourceref">The example history runs from Nov 2024 to Oct 2026. Financial charts follow transaction dates, so their totals may differ from billing-term totals on Overview.</p></div>`)}`;}
function cohortLink(label,id){return link(label,'cohort',id,`Opens the student accounts included in the ${label.toLowerCase()} group for next term.`);}
function forecastPage(){const a=assumptions(),f=forecast(a),clamp=v=>Math.max(0,Math.min(100,v)),scenarios=[{label:'Lower estimate',a:{...a,renewal:clamp(a.renewal-15),conversion:clamp(a.conversion-5),collection:clamp(a.collection-5)}},{label:'Current estimate',a,base:true},{label:'Higher estimate',a:{...a,renewal:clamp(a.renewal+10),conversion:clamp(a.conversion+5),collection:clamp(a.collection+5)}}];return `<div class="finance-intro"><div><strong>${NEXT_LABEL} · indicative forecast</strong><p>This is a possible outcome using the records and assumptions below. It is not a bill or a promise of revenue.</p></div>${b('Compare scenarios','scenarios','','primary')}</div><div class="grid equal"><section class="panel"><div class="pad"><div class="eyebrow">EXPECTED FEES FOR THE NEXT TERM</div><div class="finance-hero-value" id="forecast-total">${money(f.total)}</div><p class="finance-caption">Includes ${money(f.confirmedFees)} from agreed renewals. The rest is estimated.</p><div class="finance-formula" style="margin-top:20px"><div class="formula-row"><span>${cohortLink('Agreed renewals','Confirmed')}<small class="muted"> · ${f.confirmed.length} students</small></span><strong>${money(f.confirmedFees)}</strong></div><div class="formula-row"><span>Expected extra renewals<br><small>${money(f.pool)} pending fees × ${a.renewal}%</small></span><strong>${money(f.estimatedRenewals)}</strong></div><div class="formula-row"><span>Expected new enrolments<br><small>${f.newStudents} students × ${money(a.fee*100)}</small></span><strong>${money(f.newFees)}</strong></div><div class="formula-row"><span>Expected total fees</span><strong>${money(f.total)}</strong></div></div><p class="finance-caption">Estimated money received: <strong id="forecast-cash">${money(f.cash)}</strong> · ${a.collection}% of expected fees. The remaining fees may be collected later.</p></div></section>${panel('What goes into this estimate',`<div class="pad">${kv('Agreed renewals',`${f.confirmed.length} active students with a parent’s yes and an agreed arrangement.`)}${kv('Waiting for a decision',`${cohortLink(f.pending.length+' students','Pending')} · ${money(f.pool)} in possible fees`)}${kv('Not renewing',cohortLink(f.declined.length+' students excluded','Declined'))}${kv('Expected enquiries',a.enquiries)}${kv('Enquiries that enrol',a.conversion+'%')}${kv('New students before capacity check',f.requested)}${kv('Example places available',f.places)}${kv('New students used in estimate',f.newStudents)}<p class="finance-caption">Agreed renewals are counted once. The renewal percentage applies only to families still deciding. Trial and former students are outside the renewal pool.</p><p class="finance-caption">${f.requested>f.places?'The new-student estimate is limited by the example places available. ':'The example places can fit the estimated new students. '}This uses an overall capacity limit for the selected scope; real class availability needs a scheduling check.</p></div>`)}</div>${panel('Possible outcomes',`<div class="pad"><div class="finance-cards">${scenarios.map(s=>{const x=forecast(s.a);return `<div class="finance-card ${s.base?'base':''}"><h3>${s.label}</h3><div class="amount">${money(x.total)}</div><p class="finance-caption">Expected fees</p><div class="caption">Money received: <strong>${money(x.cash)}</strong></div><div class="caption">Pending renewals ${s.a.renewal}% · enquiry conversion ${s.a.conversion}% · collection ${s.a.collection}%</div></div>`}).join('')}</div><p class="finance-caption">These are examples using different assumptions. They are not statistical confidence ranges. All three use the same expected enquiries, average new-student fee and capacity limit.</p></div>`)}${panel('Assumptions and source records',`<div class="pad">${kv('Forecast basis',ui.custom?.scope===ui.centre+'|'+ui.programme?'Your edited example assumptions':'Original example assumptions')}${kv('Pending renewal rate',a.renewal+'% · example assumption')}${kv('Expected enquiries',a.enquiries+' · default is Jan–Mar 2026 enquiries plus an assumed 8%')}${kv('Enquiry conversion rate',a.conversion+'% · default is Jan–Mar 2026 new enrolments ÷ enquiries')}${kv('Average new-student fee',money(a.fee*100)+' · default is the average active-student term fee')}${kv('Collection rate',a.collection+'% · example assumption')}<p class="finance-caption">All fees, history, renewal answers and capacity are fictional. The forecast estimates fees billed and possible cash collection separately. It does not change any student’s bill or payment status.</p><div class="actions" style="margin-top:18px">${b('Compare scenarios','scenarios','','small')}${b('Restore assumptions','defaults','','small')}</div></div>`)}`;}
function openDialog(type,data={}){hideHint();opener=document.activeElement;dialog={type,...data};drawDialog();requestAnimationFrame(()=>$('#dialog-root button')?.focus({preventScroll:true}));}
function closeDialog(restore=true){dialog=null;$('#dialog-root').innerHTML='';$('#app').inert=false;document.body.style.overflow='';if(restore&&opener?.isConnected)opener.focus({preventScroll:true});}
function dialogContent(){const d=dialog;if(d.type==='help')return {title:'Explore the Finance workspace',body:`<div class="finance-steps"><div class="finance-step"><strong>1. Overview</strong>Start with all Singapore centres. Click a centre or a number to open the matching student accounts.</div><div class="finance-step"><strong>2. Student accounts</strong>Find a student, check their payment status and open their bills. “Not billed” means they have no bill for the selected term.</div><div class="finance-step"><strong>3. Trends & forecast</strong>Compare monthly finances and demand. Open the next-term estimate to see the calculation or try different assumptions.</div></div><p style="margin-top:18px">Try Katong to see the same families as Sarah’s Centre Head demo. Chloe has an overdue bill, Lucas has paid part of his bill, and Grace has not been billed. Arjun’s account shows a fee credit and a completed refund.</p><p class="finance-caption">Choose Review payment to match Chloe’s confirmed bank record. A parent’s screenshot alone does not mark the bill as paid. Every action here uses fictional local records.</p><div class="actions" style="margin-top:20px"><a class="btn" href="01-leads-and-conversion.html" ${attrsHelp('Opens Sarah’s separate Centre Head demo. Your finance records stay saved.')}>Open Centre Head demo</a>${b('Reset example data','reset','','small')}</div><p class="sourceref">Centre names follow <a href="https://bearyfungym.com/locations/" target="_blank" rel="noopener noreferrer" ${attrsHelp('Opens BFG’s official centre list in a new tab. Internet access is needed.')}>BFG’s centre list</a>. People, programmes, fees, dates and figures are example data. This role demo has no real access control.</p>`};
 if(d.type==='reset')return {title:'Restart the finance demo?',body:`<p>This restores the original finance examples and removes the payment matches, reminders and forecast changes saved in this file. Sarah’s Centre Head demo keeps its records.</p><div class="actions" style="margin-top:20px">${b('Restart finance demo','reset-confirm','','primary','Restores only the Finance Manager’s original example records.')}${b('Keep my examples','close')}</div>`};
 if(d.type==='activity')return {title:'Finance activity',body:db.activity.length?`<ul class="timeline">${db.activity.slice().reverse().map(x=>`<li>${esc(x.text)}<small>${fmtDate(x.date)} · Finance demo</small></li>`).join('')}</ul>`:note('No changes yet. Payment matches and example reminders will appear here.')};
 if(d.type==='scenarios'){const a=assumptions();return {title:'Compare forecast assumptions',body:`<p>Change these example values for ${esc(scopeLabel())}. The estimate updates when you choose Apply assumptions.</p><form data-form="scenarios"><div class="form-grid" style="margin-top:18px">${input('Pending families likely to renew (%)','renewal',a.renewal,'number','min="0" max="100" step="1" required','Applies only to families still deciding.')}${input('Expected enquiries next term','enquiries',a.enquiries,'number','min="0" max="100000" step="1" required')}${input('Enquiries likely to enrol (%)','conversion',a.conversion,'number','min="0" max="100" step="1" required')}${input('Average new-student term fee (SGD)','fee',a.fee,'number','min="0" max="100000" step="0.01" required')}${input('Expected fees collected (%)','collection',a.collection,'number','min="0" max="100" step="1" required','Changes the money-received estimate, not the fees estimate.')}</div><p class="finance-caption">The example capacity limit still applies. Changing these values does not change bills, payments or renewal answers.</p><div class="actions" style="margin-top:20px">${submit('Apply assumptions','Uses these assumptions and returns to the updated next-term forecast.')}${b('Cancel','close')}</div></form>`};}
 if(d.type==='unmatched'){const payments=pendingMoney();return {title:'Money waiting to be matched',wide:true,body:`<p>These payments are confirmed by a bank or payment service. Check the reference, student and amount before linking one to a bill.</p>${payments.length?payments.map(p=>{const candidates=db.invoices.filter(i=>S(i.student).centre===p.centre&&remaining(i)>=p.amount),candidate=candidates.find(i=>i.number===p.invoiceReference);return `<section class="invoice-paper" style="margin-top:20px"><h3>${money(p.amount)} received</h3>${kv('Bank reference',esc(p.reference))}${kv('Bill reference',esc(p.invoiceReference||'Not supplied'))}${kv('Centre / date',`${esc(centre(p.centre).name)} · ${fmtDate(p.date)}`)}${kv('Source',esc(p.source))}<form data-form="match"><input type="hidden" name="payment" value="${p.id}">${select('Link this money to a bill','match-'+p.id,candidates.map(i=>[i.id,`${i.number} · ${S(i.student).name} · ${money(remaining(i))} due`]),candidate?.id||'','required')}${checkbox('reviewed','I checked the bank reference, bill, student and amount.')}<div class="actions" style="margin-top:18px">${submit('Match to bill','Links this confirmed payment to the chosen bill and updates the student’s balance. It does not add another payment.')}</div></form></section>`}).join(''):note('All confirmed payments in this centre and programme have been matched.')}<p class="finance-caption">Matching does not add money to the monthly Money received chart. The bank receipt is already counted there once.</p>`};}
 if(d.type==='reminder'){const s=S(d.id),a=accountSummary(s),key=a.bills.filter(i=>remaining(i)>0).map(i=>i.id+':'+remaining(i)).sort().join('|'),sent=db.reminders.some(m=>m.key===key&&m.student===s.id),text=`Hi ${s.parent.split(' ')[0]}, ${money(a.balance)} is still due for ${s.name} for ${periodLabel()}. Please check the bill details or let our team know if you have already paid. Thank you.`;return {title:'Review payment reminder',body:`<div class="source-strip">${icon('role')}<span>Respond.io handles the message channel and delivery. This workspace keeps the send request with the student’s account.</span></div>${kv('Parent',esc(s.parent))}${kv('Student',esc(s.name))}${kv('Still due',money(a.balance))}${kv('Billing period',esc(periodLabel()))}${sent?note('A reminder for this balance has already been requested. It will not be sent again.'):!a.balance?note('There is no unpaid balance for this period.'):`<form data-form="reminder"><input type="hidden" name="student" value="${s.id}">${area('Message to parent','reminder-message',text,'required maxlength="2000"')}${checkbox('reviewed','I checked the parent, amount and message.')}<div class="actions" style="margin-top:18px">${submit('Send example reminder','Saves one example send request through Respond.io and returns to the student’s account.')}${b('Cancel','close')}</div><p class="finance-caption">This is a local example. It does not send a real message or mark the bill as paid.</p></form>`}`};}
 if(d.type==='invoice'){const i=I(d.id),s=S(i.student),payments=db.payments.filter(p=>p.invoice===i.id),refunds=db.refunds.filter(r=>r.invoice===i.id);return {title:'Bill details',wide:true,body:`<div class="invoice-paper"><div class="eyebrow">BEARYFUN GYM · EXAMPLE BILL</div><h3>${esc(i.number)}</h3><p>${esc(s.name)} · Parent: ${esc(s.parent)}</p><p class="finance-caption">${esc(centre(s.centre).name)} · ${s.programme} · ${i.purpose}</p>${kv('Issued',fmtDate(i.issued))}${kv('Due',fmtDate(i.due))}${kv('Original fees',money(i.gross))}${kv('Approved credit',money(i.credit))}${i.credit?`<p class="finance-caption">${esc(i.creditReason)}</p>`:''}${kv('Net fees billed',money(netBill(i)))}${kv('Confirmed payments',money(allocated(i)))}${kv('Completed refunds',money(refunded(i)))}${kv('Net paid',money(netPaid(i)))}${kv('Still due',money(remaining(i)))}</div><h3 class="subheading">Linked transactions</h3>${payments.length||refunds.length?[...payments.map(p=>`<div class="receipt-line"><strong>${money(p.amount)} payment · ${fmtDate(p.date)}</strong><p class="finance-caption">${esc(p.reference)} · ${esc(p.source)}</p></div>`),...refunds.map(r=>`<div class="receipt-line"><strong>${money(r.amount)} refund · ${fmtDate(r.date)}</strong><p class="finance-caption">${esc(r.reason)} · ${r.status}</p></div>`)].join(''):note('No confirmed payment is linked to this bill yet.')}<div class="actions" style="margin-top:20px">${b('Open student account','account',s.id,'primary',`Opens ${s.name}’s full financial account.`)}</div>`};}
 if(d.type==='month'){const month=ui.year+'-'+String(d.month).padStart(2,'0'),label=MONTH_NAMES[d.month-1]+' '+ui.year;if(d.kind==='demand'){const rows=demandRows([month]);return {title:label+' · demand',wide:true,body:`<p>${esc(scopeLabel())} · ${demandTotal([month],ui.demandMetric)} ${ui.demandMetric==='enrolled'?'new enrolments':ui.demandMetric==='trials'?'trial bookings':'enquiries'}.</p>${table(['Centre / programme','Enquiries','Trial bookings','New enrolments'],rows.map(x=>[`${esc(centre(x.centre).name)}<small>${x.programme}</small>`,x.enquiries,x.trials,x.enrolled]))}<p class="finance-caption">These are monthly example counts synced from the platform. They are aggregated records, not a live message inbox.</p>`};}if(ui.metric==='billed'){const bills=db.invoices.filter(i=>i.issued.startsWith(month)&&inScope(S(i.student)));return {title:label+' · fees billed',wide:true,body:`<p>${esc(scopeLabel())} · ${money(monthly(month,'billed'))} from ${bills.length} bills issued this month, after fee credits.</p>${invoiceRows(bills)}`};}const pay=db.payments.filter(p=>p.verified&&p.date.startsWith(month)&&scopedPayment(p)),refunds=db.refunds.filter(r=>r.status==='Completed'&&r.date.startsWith(month)&&inScope(S(r.student)));return {title:label+' · money received',wide:true,body:`<p>${esc(scopeLabel())} · ${money(monthly(month,'received'))} after completed refunds.</p>${table(['Date','Student / reference','Type','Amount'],[...pay.map(p=>({date:p.date,name:p.student?studentLink(S(p.student)):esc(p.invoiceReference||'Awaiting match'),reference:p.reference,type:p.invoice?'Confirmed payment':'Confirmed · awaiting match',amount:p.amount})),...refunds.map(r=>({date:r.date,name:studentLink(S(r.student)),reference:r.reason,type:'Completed refund',amount:-r.amount}))].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[fmtDate(x.date),x.name+`<small>${esc(x.reference)}</small>`,x.type,money(x.amount)]))}<p class="finance-caption">Money waiting to be matched is included once, from its confirmed bank receipt.</p>`};}
 return {title:'Finance',body:''};}
function drawDialog(){if(!dialog){$('#app').inert=false;$('#dialog-root').innerHTML='';document.body.style.overflow='';return;}const c=dialogContent();$('#app').inert=true;document.body.style.overflow='hidden';$('#dialog-root').innerHTML=`<div class="modal-backdrop"><section class="drawer ${c.wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header><div><div class="eyebrow">FINANCE WORKSPACE</div><h2 id="dialog-title">${c.title}</h2></div>${b('Close','close','','small')}</header><div class="drawer-body">${c.body}</div></section></div>`;annotate();}
function toast(text,bad=false){const e=$('#toast');e.textContent=text;e.classList.toggle('error',bad);e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,5000);}
function setFlash(text,bad=false){flash=text;flashError=bad;persist();render();$('.flash')?.focus({preventScroll:true});$('.flash')?.scrollIntoView({block:'nearest'});}
function clearList(){Object.assign(ui,{query:'',status:'All',enrolment:'All',renewal:'All',page:1});}
function log(text){db.activity.push({text,date:DAY});}
function handleAction(a,el){const id=el.dataset.id;if(a==='go'){if(id==='accounts')clearList();go(id);return;}if(a==='account'){go('account/'+id);return;}if(a==='centre'){ui.centre=id;clearList();go('accounts');return;}if(a==='metric'){clearList();ui.status=id;go('accounts');return;}if(a==='cohort'){clearList();ui.renewal=id;go('accounts');return;}if(a==='forecast'){ui.tab='forecast';go('trends');return;}if(a==='tab'){ui.tab=id;persist();render();return;}if(a==='page'){ui.page=Number(id);persist();render();return;}if(a==='clear'){clearList();persist();render();return;}if(a==='hints'){ui.hints=!ui.hints;helpPinned=null;persist();render();return;}if(a==='close'){closeDialog();return;}if(a==='reset-confirm'){db=seed();ui=db.ui;persist();go('overview');setFlash('The original finance examples are ready.');return;}if(a==='defaults'){ui.custom=null;setFlash('The original forecast assumptions are restored for this centre and programme.');return;}if(a==='month'){openDialog('month',{month:Number(id),kind:el.dataset.kind});return;}if(['help','reset','activity','scenarios','unmatched','invoice','reminder'].includes(a)){openDialog(a,{id});return;}}
function handleForm(kind,data){if(kind==='scenarios'){const a={};for(const k of ['renewal','enquiries','conversion','fee','collection']){a[k]=Number(data.get(k));if(!Number.isFinite(a[k])||a[k]<0)throw Error('Enter a valid value for each assumption.');}if(['renewal','conversion','collection'].some(k=>a[k]>100)||a.enquiries>100000||a.fee>100000)throw Error('Keep percentages between 0 and 100, and use values within the field limits.');ui.custom={...a,scope:ui.centre+'|'+ui.programme};closeDialog(false);setFlash('Forecast updated using your assumptions. Student bills and payments are unchanged.');return;}
 if(kind==='match'){if(!data.get('reviewed'))throw Error('Check the payment details before matching.');const p=db.payments.find(p=>p.id===data.get('payment')),i=I(data.get('match-'+p?.id));if(!p?.verified||p.invoice)throw Error('This payment has already been matched or is not confirmed.');if(!i||S(i.student).centre!==p.centre||i.number!==p.invoiceReference)throw Error('The bank’s bill reference does not match this bill. Choose the bill named in the bank record.');if(p.amount>remaining(i))throw Error('This payment is more than the bill’s remaining amount. It needs a separate review.');p.invoice=i.id;p.student=i.student;for(const e of db.evidence.filter(e=>e.invoice===i.id))e.status='Bank record matched';log(`${money(p.amount)} matched to ${i.number} for ${S(i.student).name}. Bank reference ${p.reference}.`);closeDialog(false);go('account/'+i.student);setFlash('Payment matched once. The bill balance is updated; no extra receipt was added.');return;}
 if(kind==='reminder'){const s=S(data.get('student')),a=accountSummary(s),text=String(data.get('reminder-message')||'').trim(),key=a.bills.filter(i=>remaining(i)>0).map(i=>i.id+':'+remaining(i)).sort().join('|');if(!data.get('reviewed')||!text)throw Error('Review the parent, balance and message before sending.');if(!a.balance)throw Error('This student has no unpaid balance for the selected period.');if(db.reminders.some(m=>m.student===s.id&&m.key===key))throw Error('A reminder for this balance has already been requested.');db.reminders.push({id:'reminder-'+db.next++,student:s.id,key,text,date:DAY,status:'Send requested · example'});log(`Payment reminder requested through Respond.io for ${s.name}: ${money(a.balance)} due.`);closeDialog(false);go('account/'+s.id);setFlash('Example reminder requested through Respond.io. The payment status stays unchanged.');}}
function showHint(el,pin=false){if(!el?.dataset.help)return;hideHint();helpOwner=el;const hint=$('#button-hint'),label=(el.getAttribute('aria-label')||el.textContent).trim().replace(/\s+/g,' ');hint.innerHTML=`<strong>${esc(label)}</strong>${esc(el.dataset.help)}`;hint.hidden=false;el.setAttribute('aria-describedby','button-hint');const r=el.getBoundingClientRect();hint.style.left=Math.max(10,Math.min(r.left,innerWidth-hint.offsetWidth-10))+'px';hint.style.top=(r.bottom+9+hint.offsetHeight<innerHeight-10?r.bottom+9:Math.max(10,r.top-hint.offsetHeight-9))+'px';if(pin)helpPinned=el;}
function hideHint(){if($('#button-hint'))$('#button-hint').hidden=true;if(helpOwner?.getAttribute('aria-describedby')==='button-hint')helpOwner.removeAttribute('aria-describedby');helpOwner=null;}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el||el.disabled)return;if(ui.hints&&el.dataset.action!=='hints'&&el.dataset.help&&helpPinned!==el){e.preventDefault();showHint(el,true);return;}helpPinned=null;hideHint();if(el.tagName==='A'||el.matches('button[type=submit]'))return;try{handleAction(el.dataset.action,el);}catch(err){toast(err.message,true);}});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();if(!form.reportValidity())return;try{handleForm(form.dataset.form,new FormData(form));}catch(err){toast(err.message,true);}});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset.filter)return;const key=el.dataset.filter;ui[key]=el.value;ui.page=1;if(key==='centre'||key==='programme'){clearList();ui.custom=null;}persist();if(key==='centre'&&route==='account'){go('accounts');return;}const id=el.id;render();document.getElementById(id)?.focus({preventScroll:true});});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.search)return;ui.query=el.value;ui.page=1;const pos=el.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{persist();render();const n=$('#student-search');n?.focus({preventScroll:true});n?.setSelectionRange(pos,pos);},180);});
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-help]');if(el&&el!==helpOwner)showHint(el);});
document.addEventListener('pointerout',e=>{const el=e.target.closest('[data-help]');if(el?.contains(e.relatedTarget))return;if(!helpPinned)hideHint();});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-help]');if(el)showHint(el);});
document.addEventListener('focusout',()=>{if(!helpPinned)hideHint();});
window.addEventListener('scroll',hideHint,true);window.addEventListener('resize',hideHint);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideHint();helpPinned=null;if(dialog){e.preventDefault();closeDialog();}return;}if(e.key==='Tab'&&dialog){const items=$$('#dialog-root button:not(:disabled),#dialog-root a,#dialog-root input:not(:disabled):not([type=hidden]),#dialog-root select:not(:disabled),#dialog-root textarea:not(:disabled)').filter(x=>x.getClientRects().length);if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0]?.focus();}}});
window.addEventListener('hashchange',()=>{closeDialog(false);parseHash();flash='';persist();render(true);});
window.addEventListener('popstate',()=>{closeDialog(false);parseHash();flash='';persist();render(true);});
parseHash();render();
</script></body></html>
