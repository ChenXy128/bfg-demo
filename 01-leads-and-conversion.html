function makeReportBody(f,from,to,src){
 const notes=[...src.notes].sort((a,b)=>a.date.localeCompare(b.date)),known=src.attendance.filter(x=>x.result!=='Unknown'),present=known.filter(x=>x.result==='Present').length,absent=known.filter(x=>x.result==='Absent').length;
 let learning='No weekly Coach feedback was recorded within these dates. Ask the Coach for input before describing learning progress.';
 if(notes.length===1)learning=`${date(notes[0].date)} · ${notes[0].coach}\n${notes[0].text}`;
 if(notes.length>1){learning=`The record brings together ${notes.length} weekly updates from this period.\n\nAt the start of the period (${shortDate(notes[0].date)}):\n${notes[0].text}`;if(notes.length>2)learning+='\n\nProgress recorded during the period:\n'+notes.slice(1,-1).map(n=>`${shortDate(n.date)}: ${n.text}`).join('\n\n');learning+=`\n\nMost recent observation (${shortDate(notes.at(-1).date)}):\n${notes.at(-1).text}`;}
 const next=[...notes].reverse().flatMap(n=>n.text.split(/(?<=[.!?])\s+/)).find(t=>/^continue\b|^keep practising\b|^keep practicing\b/i.test(t))||'Please speak with the Coach to agree the next practice goals.';
 return `Progress update for ${f.child}\n${date(from)} – ${date(to)}\nProgramme: ${f.level}\n\nLearning summary\n${learning}\n\nAttendance\n${known.length?`${present} present and ${absent} absent out of ${known.length} recorded sessions.`:'No known attendance results were recorded in this period.'}${src.attendance.some(x=>x.result==='Unknown')?' Unmarked results have been excluded.':''}\n\nAssessment results\n${src.assessments.length?src.assessments.map(a=>`${date(a.date)} · ${a.area}: ${a.result}.`).join('\n'):'No separate assessment result was recorded within these dates.'}\n\nNext steps\n${next}\n\nPlease contact the centre if you would like to discuss this update or your child’s next steps.`;
}
function sendOffer(f,c,text,by='Sarah'){if(!recommend(f).some(x=>x.id===c.id))throw Error('This class no longer matches the family’s details or has no place. Choose a suitable option again.');if(['Trial booked','Ready to enrol','Active student','Enrolled'].includes(f.stage))throw Error('This family already has a confirmed arrangement. No second trial is created.');if(f.offer?.status==='Awaiting parent')throw Error('An offer is already waiting for this parent. Receive their answer before sending another.');if(f.offer){f.offerHistory.push({...f.offer});}f.offerVersion=(f.offerVersion||0)+1;f.offer={classId:c.id,text,status:'Awaiting parent',version:f.offerVersion,approvedBy:by};f.selectedClass=c.id;f.offerDraft='';f.stage='Awaiting parent';f.needsReply=false;f.messages.push({who:by==='Sarah'?'Sarah':'Respond.io AI',text,when:'1 Nov · demo send'});log(f,`Trial offer version ${f.offer.version} sent through Respond.io.`,by==='Sarah'?'Reviewed and approved by Sarah.':'Sarah allowed the AI to continue with an eligible alternative.');}

function continueAI(f){if(f.handler==='Sarah')f.handler='AI';if(f.offer?.status!=='Declined')throw Error('This example continues after the parent declines a class time.');const excluded=[...(f.offerHistory||[]).map(o=>o.classId),f.offer.classId],c=recommend(f,excluded)[0];if(!c){f.handler='Sarah';f.needsReply=true;notify('No matching alternative for '+f.child+'. Personal help is needed.',f);log(f,'No eligible alternative found. Sarah’s personal follow-up is needed.');return 'No suitable alternative is available. Sarah has a personal follow-up; nothing was sent.';}f.autoAlternatives=true;sendOffer(f,c,offerDraft(f,c),'AI with Sarah’s permission');return 'Sarah allowed an alternative. The platform found an eligible class and Respond.io sent it in the demo.';}

 if(a==='page-prev'||a==='page-next'){ui.page+=a==='page-next'?1:-1;persist();render();$('#page-title')?.focus({preventScroll:true});return;}
 if(a==='take-over'){if(!f)throw Error('Family record not found.');takeOver(f);go(route==='trial'?'trial/'+id:'profile/'+id+'/parents');toast('Sarah is handling this conversation. AI follow-up is paused.');requestAnimationFrame(()=>$('#personal-text')?.focus({preventScroll:true}));return;}

 if(a==='confirm-enrol'){if(!f||f.stage!=='Ready to enrol'||f.trialResult!=='Present'||!f.parentEnrol||!db.bookings.some(x=>x.family===f.id&&x.status==='Confirmed'))throw Error('A confirmed trial, attendance result and explicit parent intention are required.');f.stage='Enrolled';f.student=true;f.className=C(f.selectedClass)?.name||'Agreed class';f.coach=C(f.selectedClass)?.coach||f.coach;f.renewal='Not due';f.needsReply=false;log(f,'Sarah confirmed enrolment on the existing family record.','Trial and original source history were retained.');notify(f.child+' is now enrolled.',f);setFlash('Enrolment confirmed. The student profile keeps the same parent, enquiry and trial history.');return;}
 if(a==='ask-coach'){if(!f)throw Error('Student not found.');openDialog('coach',{family:id});return;}
 if(['load-report','preview-report','new-version'].includes(a)){if(!f)throw Error('Student not found.');const r=reportBy(f,el.dataset.report);if(!r)throw Error('Choose a saved report version first.');if(a==='preview-report'){openDialog('preview',{family:f.id,report:r.id});return;}if(a==='new-version'){const copy={...JSON.parse(JSON.stringify(r)),id:'report-'+db.next++,version:f.reports.length+1,approved:false,published:false,delivery:null,approvedAt:null,publishedAt:null};f.reports.push(copy);ui.reportId=copy.id;log(f,'A new private report version was created.','Published version '+r.version+' was kept unchanged.');}else ui.reportId=r.id;const active=activeReport(f);ui.reportFrom=active.from;ui.reportTo=active.to;persist();go('profile/'+f.id+'/reports');return;}
 if(['save-report','approve-report','publish-report','confirm-publish'].includes(a)){if(!f)throw Error('Student not found.');const r=reportBy(f,el.dataset.report);if(!r)throw Error('Generate or open a report first.');if(r.published)throw Error('This version has already been published. Create a new version to change it.');if(a==='save-report'){const body=$('#report-body')?.value||r.body;if(!body.trim())throw Error('The report cannot be empty.');r.body=body;setFlash('Private draft saved. Nothing has been sent to the parent.');return;}if(a==='approve-report'){if(!$('#report-reviewed')?.checked)throw Error('Check the source records and tick the review box before approving.');if(!r.body.trim()||!f.verified||!f.canContact)throw Error('A reviewed report and checked, contactable parent are required.');r.approved=true;r.approvedBy='Sarah · Centre Head';r.approvedAt='1 Nov · demo review';setFlash('Approved by the Centre Head. The report is still private until you choose Publish.');return;}if(!r.approved)throw Error('The current report text needs Centre Head approval before publishing.');if(a==='publish-report'){openDialog('publish',{family:f.id,report:r.id});return;}if(!f.verified||!f.canContact)throw Error('The intended parent’s relationship and contact permission need checking.');r.published=true;r.publishedAt='1 Nov · 10:15am';r.recipient=f.parent;r.delivery='Sent';r.sendAttempts=1;f.messages.push({who:'Sarah',text:`A Centre Head-approved progress report for ${f.child}, ${date(r.from)}–${date(r.to)}, has been shared through Respond.io. Report version ${r.version}.`,when:'1 Nov · demo publication',report:r.id});db.reportsSent.push({family:f.id,report:r.id,version:r.version});log(f,'Progress report version '+r.version+' published for '+f.parent+'.','Centre Head approved. Respond.io send recorded; delivery confirmation is separate.');notify('Progress report published for '+f.child+'.',f,'reports');closeDialog(false);setFlash('Approved report published and sent through Respond.io in the demo. Delivery status is tracked separately.');return;}
 if(a==='retry-report'){const r=reportBy(f,el.dataset.report);if(!r?.published||r.delivery!=='Failed')throw Error('Only a published report with a known delivery failure can be sent again.');r.delivery='Sent';r.sendAttempts=(r.sendAttempts||1)+1;ui.reportId=r.id;log(f,'Published report version '+r.version+' sent again after a delivery failure.','The saved text and publication version are unchanged.');setFlash('The same approved report was sent again in the demo. A new delivery result is still needed.');return;}
 if(a==='reset'){openDialog('reset');return;}
 if(a==='confirm-reset'){db=seed();ui=db.ui;persist();closeDialog(false);go('dashboard');toast('Only this combined demo has been reset.');return;}
 if(a.startsWith('demo-')){handleDemo(a,el);return;}
 throw Error('This action is not available on the current screen.');
}
function handleDemo(a,el){const id=el.dataset.id,f=F(id);let msg='Example event received.',destination=null;
 if(a==='demo-accept'){msg=receiveAcceptance(f);destination='trial/'+f.id;}
 if(a==='demo-decline'){receiveDecline(f);if(f.autoAlternatives&&f.handler!=='Sarah')msg=continueAI(f);else msg='Parent declined the time. Sarah can review alternatives or let the AI continue.';destination='trial/'+f.id;}
 if(a==='demo-trial-result'){if(!f||!db.bookings.some(b=>b.family===f.id&&b.status==='Confirmed'))throw Error('Confirm a trial booking first.');if(f.stage==='Enrolled')throw Error('This trial has already led to enrolment.');f.trialResult='Present';f.parentEnrol=true;f.stage='Ready to enrol';f.needsReply=true;f.messages.push({who:'Parent',text:'The trial went well. We would like to enrol '+f.child+'.',when:'Later example · after the trial'});log(f,'Assigned Coach’s trial attendance received: Present.','Later example event; parent explicitly asked to enrol.');notify('Enrolment decision ready for '+f.child+'.',f);destination='profile/'+f.id+'/overview';msg='Trial result and parent intention received. Sarah can review enrolment on the profile.';}
 if(a==='demo-coach-reply'){const t=db.coachTasks.find(t=>t.id===id);if(!t||t.reply)throw Error('This request is not waiting for a Coach reply.');const child=F(t.family);t.reply=`${child.child} completed the balance sequence with fewer reminders in the latest example session. Controlled landings are still developing. We can explain the progress and agree a simple practice goal with the family.`;t.status='Coach replied';child.notes||=[];child.notes.push({id:'note-'+db.next++,date:DEMO_DAY,coach:t.coach,text:t.reply,assessment:'Developing',internal:''});log(child,'Reply received from '+t.coach+'.','Stored as weekly feedback dated 1 Nov.');notify('Coach input received for '+child.child+'.',child,'support');destination='profile/'+child.id+'/support';msg='Coach reply received and added to the student’s dated feedback record.';}
 if(a==='demo-return-reply'){const job=db.jobs.find(j=>j.family===id);if(!job||job.status!=='Sent'||!f?.canContact)throw Error('This returning-family message is not waiting for a reply.');job.status='Parent replied';f.stage='Returning enquiry';f.intent='Trial interest';f.needsReply=true;f.handler='Sarah';f.messages.push({who:'Parent',text:'Thanks for checking in. Could Kai try a Sunday class before returning? Please ask Sarah to contact us.',when:'1 Nov · received example'});log(f,'Former parent replied to the 30-day invitation.','Sarah has a new task on the same family record. Previous history is kept.');notify('Rebecca replied about Kai’s return.',f,'parents');destination='returning';msg='Parent reply received. Sarah’s new task is linked to Kai’s existing student history.';}
 if(a==='demo-day30'){let n=0;for(const j of db.jobs){const child=F(j.family);if(j.status==='Scheduled'&&j.due<=DEMO_DAY&&child?.canContact&&child.verified&&child.stage==='Former student'){j.status='Sent';j.sent='1 Nov · demo scheduled check';child.messages.push({who:'Respond.io AI',text:`Hi ${child.parent.split(' ')[0]}, would you like us to help ${child.child} explore returning to a suitable class?`,when:j.sent});log(child,'Permitted day-30 return invitation sent through Respond.io.');n++;}}msg=n?n+' due, permitted return invitations sent. No personal task is created until a parent replies.':'No additional permitted family is due today. Already-sent invitations were not repeated.';destination='returning';}
 if(a==='demo-delivery'){const r=reportBy(f,el.dataset.report);if(!r?.published)throw Error('Publish a report before receiving its delivery result.');r.delivery=el.dataset.result==='Failed'?'Failed':'Delivered';log(f,'Report version '+r.version+' delivery update: '+r.delivery+'.','Received from the simulated Respond.io connection.');notify('Report delivery '+r.delivery.toLowerCase()+' for '+f.child+'.',f,'reports');destination='profile/'+f.id+'/reports';ui.reportId=r.id;msg='Delivery update received: '+r.delivery+'. The published report text has not changed.';}
 if(a==='demo-report-reply'){const r=reportBy(f,el.dataset.report);if(!r?.published)throw Error('Publish a report first.');if(r.parentReplyReceived)throw Error('This example parent reply has already been received.');r.parentReplyReceived=true;f.messages.push({who:'Parent',text:'Thank you for the progress report. Could the Coach explain what we can practise next?',when:'1 Nov · received example',report:r.id});db.coachTasks.push({id:'ct'+db.next++,family:f.id,coach:f.coach,status:'Waiting for Coach',message:'Parent asks what to practise next after progress report version '+r.version+'. Please share a suitable suggestion.',sent:'1 Nov · parent question routed',reply:null});log(f,'Parent replied about report version '+r.version+'.','A follow-up question was assigned to '+f.coach+'.');notify('Parent asked a question about '+f.child+'’s report.',f,'parents');destination='profile/'+f.id+'/parents';msg='Parent reply received. The question and assigned Coach follow-up are saved in this profile.';}
 persist();closeDialog(false);if(destination)go(destination);setFlash(msg);
}
function showHint(el,pin=false){if(!el?.dataset.help)return;hideHint();helpOwner=el;const hint=$('#button-hint'),label=(el.getAttribute('aria-label')||el.textContent).trim().replace(/\s+/g,' ');hint.innerHTML=`<strong>${esc(label)}</strong>${esc(el.dataset.help)}`;hint.hidden=false;el.setAttribute('aria-describedby','button-hint');const r=el.getBoundingClientRect();hint.style.left=Math.max(10,Math.min(r.left,innerWidth-hint.offsetWidth-10))+'px';const below=r.bottom+9;hint.style.top=(below+hint.offsetHeight<innerHeight-10?below:Math.max(10,r.top-hint.offsetHeight-9))+'px';if(pin)helpPinned=el;}
function hideHint(){const el=$('#button-hint');if(el)el.hidden=true;if(helpOwner?.getAttribute('aria-describedby')==='button-hint')helpOwner.removeAttribute('aria-describedby');helpOwner=null;}
let searchTimer=null;
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(ui.hints&&el.dataset.action!=='hints'&&el.dataset.help&&helpPinned!==el){e.preventDefault();showHint(el,true);return;}helpPinned=null;hideHint();if(el.tagName==='A')return;if(el.disabled)return;const a=el.dataset.action;if(!a)return;try{handleAction(a,el);}catch(err){closeDialog(false);setFlash(err.message,true);}});

 if(el.id==='report-from'||el.id==='report-to'){ui.reportFrom=$('#report-from').value;ui.reportTo=$('#report-to').value;const f=F(record);if(f){const src=reportSources(f,ui.reportFrom,ui.reportTo);$('#source-count').textContent=sourceSummary(src)+' in the selected period.';$('#source-detail').innerHTML=sourceDetails(activeReport(f)?.sourceSnapshot||src);}persist();return;}

});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.search){ui[el.dataset.search]=el.value;ui.page=1;const id=el.id,pos=el.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{persist();render();const n=document.getElementById(id);n?.focus({preventScroll:true});n?.setSelectionRange(pos,pos);},180);return;}
 if(el.dataset.reportEdit){const f=F(el.dataset.family),r=f?.reports.find(r=>r.id===el.dataset.reportEdit);if(!r||r.published)return;r.body=el.value;r.approved=false;r.approvedAt=null;r.approvedBy=null;$('#approval-status').innerHTML=badge('Edited · needs your approval','orange');const checked=$('#report-reviewed');if(checked)checked.checked=false;$('#report-actions').innerHTML=reportActionBlock(f,r);annotate();clearTimeout(persistTimer);persistTimer=setTimeout(persist,250);return;}

});
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-help]');if(el&&el!==helpOwner)showHint(el);});
